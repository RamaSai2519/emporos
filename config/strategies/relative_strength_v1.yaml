# relative_strength_v1 — CANDIDATE, not enabled. It becomes enabled only if it passes strategy
# curation (docs/strategies/): walk-forward out-of-sample, net of charges, under the platform's
# risk rules. EM-125.
# Relative-strength ranking (5m): every `rebalance_every_bars` bars, ranks the whole universe by
# `lookback`-bar close-to-close return, longs the strongest `top_n` and shorts the weakest
# `bottom_n` (liquidity- and threshold-filtered), and rotates out whatever falls out of its band.
# Cross-sectional read, one strategy instance over the whole universe: see
# src/emporos/strategies/builtin/relative_strength_v1.py and
# docs/strategies/em125-cross-sectional-seam.md for the design note EM-125 asked for.
#
# Rates and money are integers or QUOTED strings; times are quoted "HH:MM" (IST). No secrets here.
name: relative_strength_v1
enabled: false
timeframe: 5m

universe:
  type: static
  instruments: ["NSE:ADANIENT-EQ", "NSE:ASIANPAINT-EQ", "NSE:AXISBANK-EQ", "NSE:BAJAJFINSV-EQ", "NSE:BAJFINANCE-EQ", "NSE:BHARTIARTL-EQ", "NSE:COALINDIA-EQ", "NSE:HCLTECH-EQ", "NSE:HDFCBANK-EQ", "NSE:HINDUNILVR-EQ", "NSE:ICICIBANK-EQ", "NSE:INFY-EQ", "NSE:ITC-EQ", "NSE:JSWSTEEL-EQ", "NSE:KOTAKBANK-EQ", "NSE:LT-EQ", "NSE:M&M-EQ", "NSE:MARUTI-EQ", "NSE:NESTLEIND-EQ", "NSE:NTPC-EQ", "NSE:ONGC-EQ", "NSE:POWERGRID-EQ", "NSE:SBIN-EQ", "NSE:SUNPHARMA-EQ", "NSE:TATASTEEL-EQ", "NSE:TECHM-EQ", "NSE:TITAN-EQ", "NSE:ULTRACEMCO-EQ", "NSE:WIPRO-EQ"]

parameters:
  lookback: 12
  rebalance_every_bars: 6
  top_n: 2
  bottom_n: 1
  allow_short: true
  min_avg_volume: 50000
  min_abs_roc_bps: "40"

risk:                    # sized to fit config/risk.yaml (max_position_value 25000 per instrument)
  max_position_value: 25000
  max_open_positions: 3  # matches top_n + bottom_n: the intended book, not just a backstop
  stop_loss_pct: "1.0"
  target_pct: "2.0"

execution:
  limit_buffer_bps: 5
  reprice_after_seconds: 30
  max_reprices: 3

session:
  no_new_entries_after: "14:45"
  square_off_at: "15:15"
