# liquidity_thrust_v1 — CANDIDATE, not enabled. It becomes enabled only if it passes strategy
# curation (docs/strategies/): walk-forward out-of-sample, net of charges, under the platform's
# risk rules. EM-171 (EM-173).
# Volume-surge order-flow proxy (5m): trades a rare bar whose volume is far above its own trailing
# average AND closes near its own extreme, read as a thrust that outside money is behind. Selective
# by construction (most bars are ignored); exits on a fixed, wide ATR target rather than a trail.
# See src/emporos/strategies/builtin/liquidity_thrust_v1.py and
# docs/strategies/em171-hypothesis.md for the pre-declared hypothesis.
#
# Rates and money are integers or QUOTED strings; times are quoted "HH:MM" (IST). No secrets here.
name: liquidity_thrust_v1
enabled: false
timeframe: 5m

universe:
  type: static
  instruments: ["NSE:ADANIENT-EQ", "NSE:ASIANPAINT-EQ", "NSE:AXISBANK-EQ", "NSE:BAJAJFINSV-EQ", "NSE:BAJFINANCE-EQ", "NSE:BHARTIARTL-EQ", "NSE:COALINDIA-EQ", "NSE:HCLTECH-EQ", "NSE:HDFCBANK-EQ", "NSE:HINDUNILVR-EQ", "NSE:ICICIBANK-EQ", "NSE:INFY-EQ", "NSE:ITC-EQ", "NSE:JSWSTEEL-EQ", "NSE:KOTAKBANK-EQ", "NSE:LT-EQ", "NSE:M&M-EQ", "NSE:MARUTI-EQ", "NSE:NESTLEIND-EQ", "NSE:NTPC-EQ", "NSE:ONGC-EQ", "NSE:POWERGRID-EQ", "NSE:SBIN-EQ", "NSE:SUNPHARMA-EQ", "NSE:TATASTEEL-EQ", "NSE:TECHM-EQ", "NSE:TITAN-EQ", "NSE:ULTRACEMCO-EQ", "NSE:WIPRO-EQ"]

parameters:
  atr_period: 14
  vol_window: 20
  vol_surge_mult: "3.0"
  close_location_min: "0.75"
  min_range_bps: 40
  stop_atr_mult: "1.0"
  target_atr_mult: "4.0"
  max_entries: 1
  allow_short: true

risk:                    # sized to fit config/risk.yaml (max_position_value 25000 per instrument)
  max_position_value: 25000
  max_open_positions: 3
  stop_loss_pct: "1.0"
  target_pct: "4.0"

execution:
  limit_buffer_bps: 5
  reprice_after_seconds: 30
  max_reprices: 3

session:
  no_new_entries_after: "14:45"
  square_off_at: "15:15"
