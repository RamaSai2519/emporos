# Non-tradable reference series (EM-191 D2, EDGE_SEARCH_PLAN.md §4.2): the market's own indices and
# volatility, fetched as candles for regime conditioning, beta hedging and lead-lag. Tokens, symbols
# and names are the Angel One scrip master's `AMXIDX` rows, checked against a recorded copy in
# tests/fixtures/reference_series_master_rows.json and against the live master before every fetch.
#
# These are NOT instruments: the instrument master leaves index rows out on purpose, so no strategy
# can resolve one and no order can name one. Declared BEFORE any data was fetched or used; adding a
# series is a new commit that says why.
