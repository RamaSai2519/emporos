# Local dev only. MongoDB is deliberately absent — every environment uses the Atlas
# `emporos_dev` database via MONGO_URL (plan.md §6.0). MinIO is the S3-compatible target
# for the cold-storage abstraction:  S3_ENDPOINT_URL=http://localhost:9000 S3_BUCKET=emporos-dev
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: emporos-local
      MINIO_ROOT_PASSWORD: emporos-local-secret
    volumes:
      - minio-data:/data

volumes:
  minio-data:
