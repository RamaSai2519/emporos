name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # ENV intentionally left unset at the job level -> emporos_dev by default
      # (plan.md §6.0). The ENV=main case in the integration suite is exercised
      # by the test itself (a read-only ping, never a write) to prove the
      # resolution end to end — CI never sets ENV=main globally.
      PIPENV_VENV_IN_PROJECT: 1
      MONGO_URL: ${{ secrets.MONGO_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies (locked, deterministic)
        run: pipenv install --deploy --dev

      - name: ruff check
        run: pipenv run ruff check src tests

      - name: ruff format --check
        run: pipenv run ruff format --check src tests

      - name: mypy --strict (domain, broker, risk, execution)
        run: pipenv run mypy --strict src/emporos/domain src/emporos/broker src/emporos/risk src/emporos/execution

      - name: import-linter
        run: pipenv run lint-imports

      - name: pytest (unit)
        run: pipenv run pytest tests/unit -q

      - name: pytest (integration — real Atlas emporos_dev)
        if: ${{ env.MONGO_URL != '' }}
        run: pipenv run pytest tests/integration -q -m integration
