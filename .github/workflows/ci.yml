name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # ENV intentionally left unset at the job level -> emporos_dev by default
      # (plan.md §6.0). The ENV=main case in the integration suite is exercised
      # by the test itself (a read-only ping, never a write) to prove the
      # resolution end to end — CI never sets ENV=main globally.
      PIPENV_VENV_IN_PROJECT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies (locked, deterministic)
        run: pipenv install --deploy --dev

      - name: ruff check
        run: pipenv run ruff check src tests scripts

      - name: ruff format --check
        run: pipenv run ruff format --check src tests scripts

      - name: mypy --strict (whole package)
        run: pipenv run mypy --strict src/emporos

      - name: import-linter
        run: pipenv run lint-imports

      - name: no hardcoded instrument tokens in strategies (plan.md §8)
        run: pipenv run check-tokens

      - name: pytest with coverage (fast, DB-free gate)
        run: pipenv run test

      - name: coverage gates (plan.md §18)
        run: pipenv run coverage-gate

  db-backed:
    runs-on: ubuntu-latest
    env:
      PIPENV_VENV_IN_PROJECT: 1
      MONGO_URL: ${{ secrets.MONGO_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies (locked, deterministic)
        run: pipenv install --deploy --dev

      - name: pytest with coverage (unit + integration, live Atlas)
        if: ${{ env.MONGO_URL != '' }}
        run: pipenv run pytest -q --cov=emporos --cov-branch

      - name: coverage gates (plan.md §18)
        if: ${{ env.MONGO_URL != '' }}
        run: pipenv run coverage-gate
