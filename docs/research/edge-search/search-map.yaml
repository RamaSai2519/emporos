  - id: L17-daily-top-shock-fade
    lane: L17
    hypothesis: l17-daily-top-shock-fade
    status: SCREEN_REJECT
    requires: [F2, F2B, F3, F3B, F4, VAULT, D1, D5]
    experiments: [EXP-20260925-l17-daily-top-shock-fade-d8270b59]
    lesson: "4 arms on D1 (148 names, Discovery, Rs 50,000), the top-1 confirmed shock per session: the rank recovers gross that the per-name threshold loses on the same names (+0.21% at a 1% floor, +0.34% at 2.5%, against about 0% for EM-213's D1 fade), and the 2.5% arms are net +0.11% at benchmark (t 1.2, 958-1,100 trades), but gross stays under the 0.495% adverse break-even and one instrument carries over half the net. Removing results days changes nothing (news is not the driver). The declared children are L13 passive entry (needs D7) and L1 size: at Rs 2.5L the adverse break-even is 0.382%, still above 0.341%, so no child is declared now (advisory scan)"
