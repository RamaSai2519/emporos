  - {id: L2-fno-ban-days,               lane: L2, hypothesis: fno-ban-entry-exit,         status: TODO, requires: [F2, F2B, F3, F3B, F4, VAULT, D5b]}
  - id: L3-raw-gap-hold-to-close
    lane: L3
    hypothesis: l3-raw-gap-hold-to-close
    status: SCREEN_REJECT
    requires: [F2, F2B, F3, F3B, F4, VAULT]
    experiments: [EXP-20260924-l3-raw-gap-hold-to-close-9aa066ef]
    lesson: "16 arms on Discovery: continuation is gross-negative, fade is gross +0.07..0.10% at 1-2% gaps (a third of the 0.324% benchmark cost) and does not grow with gap size; 6 arms INFEASIBLE and 10 SCREEN_REJECT, none passes (advisory scan)"
  - {id: L3-idio-gap-continuation,      lane: L3, hypothesis: idio-gap-continuation,      status: TODO, requires: [F2, F2B, F3, F3B, F4, VAULT, D2]}
  - {id: L3-idio-gap-fade,              lane: L3, hypothesis: idio-gap-fade,              status: TODO, requires: [F2, F2B, F3, F3B, F4, VAULT, D2]}
  - id: L3-orb-high-rvol-wide-range
    lane: L3
    hypothesis: l3-orb-high-rvol-wide-range
    status: SCREEN_REJECT
    requires: [F2, F2B, F3, F3B, F4, VAULT]
    experiments: [EXP-20260924-l3-orb-high-rvol-wide-range-16e11e3e]
    lesson: "12 arms on Discovery, all INFEASIBLE (median |move| 0.4-0.8% vs 1.27% bar): gross return rises monotonically with the opening-volume multiple (0.07% at 1.5x to 0.20% at 3x, hold-to-close) but stays under the 0.324% benchmark cost, net -0.13..-0.30%; the time stop at 12:30 halves gross; the width floor adds nothing (advisory scan)"
  - id: L3-orb-extreme-rvol
    lane: L3
    hypothesis: orb-extreme-rvol
    parent: L3-orb-high-rvol-wide-range
    status: TODO
    requires: [F2, F2B, F3, F3B, F4, VAULT]
  - id: L3-first-hour-shock-reversal
    lane: L3
    hypothesis: l3-first-hour-shock-reversal
    status: SCREEN_REJECT
    requires: [F2, F2B, F3, F3B, F4, VAULT]
    experiments: [EXP-20260924-l3-first-hour-shock-reversal-427cd1a0]
    lesson: "6 arms on Discovery, all INFEASIBLE (median |move| 0.85-1.23% vs 1.27%): waiting for a first-hour retrace lifts the fade's gross from <0.1% (EM-201) to 0.17-0.35%, rising with gap size (0.19, 0.26, 0.35% at 1/1.5/2% gaps, retrace 0.25), but only the 2% gap at retrace 0.25 nets positive (+0.02%, t 0.24, 809 trades); a looser retrace floor beats a stricter one (advisory scan)"
  - id: L3-first-hour-reversal-large-gap
    lane: L3
    hypothesis: l3-first-hour-reversal-large-gap
    parent: L3-first-hour-shock-reversal
    status: SCREEN_REJECT
    requires: [F2, F2B, F3, F3B, F4, VAULT]
    experiments: [EXP-20260924-l3-first-hour-reversal-large-gap-b481b077]
    lesson: "4 arms on Discovery, all feasible (median |move| 1.39-1.70%) but none passes: gross 0.43% (2.5% gap) and 0.39% (3%) at retrace 0.25 clears the 0.324% benchmark cost yet not the 0.636% adverse break-even, net +0.10% t 0.77 and +0.06% t 0.33; a 0.5 retrace floor halves gross; trades 504/301 at retrace 0.25 sit at the floor. The fade-after-a-gap family is closed on Discovery; the only route is D1's wider universe, not a looser filter (advisory scan)"
  - id: L4-nr7-inside-day-breakout
    lane: L4
    hypothesis: l4-nr7-inside-day-breakout
    status: SCREEN_REJECT
    requires: [F2, F2B, F3, F3B, F4, VAULT]
    experiments: [EXP-20260924-l4-nr7-inside-day-breakout-52d83b6c]
    lesson: "6 arms on Discovery, all INFEASIBLE (median |move| 0.65-0.70%) with gross 0.02-0.05% on 5,800-12,900 trades: yesterday's compression (NR4, NR7, inside) does not predict a bigger next-day move on mega-caps, and a bigger break buffer changes nothing; no child, no mechanism for the opposite direction that the data suggests (advisory scan)"
  - id: L4-gap-fade-expected-range
    lane: L4
    hypothesis: gap-fade-expected-range
    parent: L3-raw-gap-hold-to-close
    status: TODO
    requires: [F2, F2B, F3, F3B, F4, VAULT]
